<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday GD ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:Poppins,sans-serif;

height:100vh;

background:linear-gradient(-45deg,#ff9ec4,#ffd6e8,#fce3ff,#fff2d8);

background-size:400% 400%;

animation:bg 12s ease infinite;

display:flex;

justify-content:center;

align-items:center;

overflow:hidden;

}

@keyframes bg{

0%{background-position:0% 50%;}

50%{background-position:100% 50%;}

100%{background-position:0% 50%;}

}

/* Floating Hearts */

.hearts{

position:fixed;

width:100%;

height:100%;

pointer-events:none;

}

.heart{

position:absolute;

bottom:-50px;

font-size:22px;

animation:float 8s linear infinite;

opacity:.8;

}

@keyframes float{

0%{

transform:translateY(0) scale(1);

opacity:1;

}

100%{

transform:translateY(-120vh) scale(1.8);

opacity:0;

}

}

/* Card */

.card{

width:90%;

max-width:420px;

background:rgba(255,255,255,.18);

backdrop-filter:blur(15px);

border-radius:25px;

padding:35px;

text-align:center;

box-shadow:0 15px 35px rgba(0,0,0,.2);

animation:pop 1s;

}

@keyframes pop{

from{

transform:scale(.5);

opacity:0;

}

to{

transform:scale(1);

opacity:1;

}

}

h1{

font-family:Great Vibes;

font-size:60px;

color:#ff2d75;

}

h2{

margin-top:10px;

font-size:30px;

color:white;

}

p{

margin-top:20px;

line-height:1.8;

color:white;

font-size:16px;

}

.cake{

font-size:80px;

margin:20px 0;

animation:bounce 2s infinite;

}

@keyframes bounce{

50%{

transform:translateY(-10px);

}

}

button{

margin-top:30px;

padding:15px 35px;

border:none;

border-radius:50px;

background:#ff2d75;

color:white;

font-size:18px;

cursor:pointer;

transition:.3s;

}

button:hover{

transform:scale(1.08);

background:#ff0f60;

}

.footer{

margin-top:20px;

color:white;

font-size:14px;

}

</style>

</head>

<body>

<div class="hearts" id="hearts"></div>

<div class="card">

<div class="cake">🎂</div>

<h1>Happiest Birthday</h1>

<h2>GD ❤️</h2>

<p>

Welcome to your little birthday surprise.

Every page of this website is filled with love, smiles, and special wishes made just for you.

I hope today becomes one of your happiest memories.

💖

</p>

<button onclick="celebrate()">

Let's Begin 🎉

</button>

<div class="footer">

Made with ❤️ just for you

</div>

</div>

<script>

// Floating Hearts

function heart(){

const h=document.createElement("div");

h.className="heart";

const emoji=["💖","💕","🌸","✨","🤍"];

h.innerHTML=emoji[Math.floor(Math.random()*emoji.length)];

h.style.left=Math.random()*100+"vw";

h.style.fontSize=(20+Math.random()*20)+"px";

h.style.animationDuration=(5+Math.random()*4)+"s";

document.getElementById("hearts").appendChild(h);

setTimeout(()=>{

h.remove();

},9000);

}

setInterval(heart,300);

// Confetti

function celebrate(){

confetti({

particleCount:200,

spread:180,

origin:{y:0.6}

});

setTimeout(()=>{

confetti({

particleCount:150,

angle:60,

spread:70,

origin:{x:0}

});

},300);

setTimeout(()=>{

confetti({

particleCount:150,

angle:120,

spread:70,

origin:{x:1}

});

},500);

setTimeout(()=>{

window.location.href="page2.html";

},2500);

}

// Auto Confetti

window.onload=()=>{

celebrate();

}

</script>

</body>

</html>
